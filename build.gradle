buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath("com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:9.3.0")
    }
}

plugins {
    id 'fabric-loom' version '1.17.21'
    id 'com.gradleup.shadow' version "9.3.0"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
        content {
            includeGroup("me.djtheredstoner")
        }
    }
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        url = "https://maven.bawnorton.com/releases"
        content {
            includeGroup("com.github.bawnorton.mixinsquared")
        }
    }
    mavenLocal()
}

loom {
    accessWidenerPath = file("src/main/resources/flashback.accesswidener")
}

dependencies {
    // Minecraft and fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Login in dev environment
    runtimeOnly("me.djtheredstoner:DevAuth-fabric:1.1.2")
    runtimeOnly("org.apache.httpcomponents:httpclient:4.5.14")
    runtimeOnly("org.apache.httpcomponents:httpcore:4.4.16")

    // MixinConstraints
    include(implementation("com.moulberry:mixinconstraints:1.0.8"))

    // MixinSquared
    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1")))

    // Lattice (config)
    include(modImplementation("com.moulberry:lattice:1.3.0"))

    // Apache stuff
    include(implementation("org.apache.commons:commons-math3:3.6.1"))

    // Mod compatibility
    modCompileOnly("maven.modrinth:distanthorizons:uzLZ00HG")
    modCompileOnly("maven.modrinth:sodium:RncWhTxD")
    modCompileOnly("maven.modrinth:iris:kuOV4Ece")
    modCompileOnly("maven.modrinth:bobby:2cuVyTav")
    modCompileOnly("maven.modrinth:simple-voice-chat:6PKCVne5")
    modCompileOnly("maven.modrinth:replaymod:NtlpUQgI")
    modCompileOnly("maven.modrinth:modmenu:xhN1IvHi")
    modCompileOnly("maven.modrinth:starlight:1.1.3+1.20.2")

    // FFmpeg
    shadow(implementation("org.bytedeco:javacv-platform:1.5.14") {
        exclude group: "org.bytedeco", module: "artoolkitplus"
        exclude group: "org.bytedeco", module: "artoolkitplus-platform"
        exclude group: "org.bytedeco", module: "flycapture"
        exclude group: "org.bytedeco", module: "flycapture-platform"
        exclude group: "org.bytedeco", module: "leptonica"
        exclude group: "org.bytedeco", module: "leptonica-platform"
        exclude group: "org.bytedeco", module: "libdc1394"
        exclude group: "org.bytedeco", module: "libdc1394-platform"
        exclude group: "org.bytedeco", module: "libfreenect"
        exclude group: "org.bytedeco", module: "libfreenect-platform"
        exclude group: "org.bytedeco", module: "libfreenect2"
        exclude group: "org.bytedeco", module: "libfreenect2-platform"
        exclude group: "org.bytedeco", module: "librealsense2"
        exclude group: "org.bytedeco", module: "librealsense2-platform"
        exclude group: "org.bytedeco", module: "librealsense"
        exclude group: "org.bytedeco", module: "librealsense-platform"
        exclude group: "org.bytedeco", module: "openblas"
        exclude group: "org.bytedeco", module: "openblas-platform"
        exclude group: "org.bytedeco", module: "opencv"
        exclude group: "org.bytedeco", module: "opencv-platform"
        exclude group: "org.bytedeco", module: "tesseract"
        exclude group: "org.bytedeco", module: "tesseract-platform"
        exclude group: "org.bytedeco", module: "videoinput"
        exclude group: "org.bytedeco", module: "videoinput-platform"
        exclude group: "org.bytedeco", module: "ffmpeg"
        exclude group: "org.bytedeco", module: "javacpp"
    })
    // Include bytedeco ffmpeg & natives
    shadow(implementation(group: "org.bytedeco", name: "ffmpeg", version: "8.1.2-1.5.14", classifier: ""))
    shadow(api(rootProject.files('ffmpeg/ffmpeg-natives-linux.jar'))) // Custom natives are from https://github.com/BtbN/FFmpeg-Builds/
    shadow(api(rootProject.files('ffmpeg/ffmpeg-natives-windows.jar')))
    shadow(implementation(group: "org.bytedeco", name: "ffmpeg", version: "8.1.2-1.5.14", classifier: "macosx-x86_64"))
    shadow(implementation(group: "org.bytedeco", name: "ffmpeg", version: "8.1.2-1.5.14", classifier: "macosx-arm64"))
    // Include only platforms we use
    shadow(implementation(group: "org.bytedeco", name: "javacpp", version: "1.5.14", classifier: "linux-x86_64"))
    shadow(implementation(group: "org.bytedeco", name: "javacpp", version: "1.5.14", classifier: "windows-x86_64"))
    shadow(implementation(group: "org.bytedeco", name: "javacpp", version: "1.5.14", classifier: "macosx-x86_64"))
    shadow(implementation(group: "org.bytedeco", name: "javacpp", version: "1.5.14", classifier: "macosx-arm64"))

    // Native File Dialogs
    shadow(implementation("org.lwjgl:lwjgl-nfd:3.3.3"))
    shadow(api("org.lwjgl:lwjgl-nfd:3.3.3:natives-windows"))
    shadow(api("org.lwjgl:lwjgl-nfd:3.3.3:natives-linux"))
    shadow(api("org.lwjgl:lwjgl-nfd:3.3.3:natives-macos"))
    shadow(api("org.lwjgl:lwjgl-nfd:3.3.3:natives-windows-arm64"))
    shadow(api("org.lwjgl:lwjgl-nfd:3.3.3:natives-linux-arm64"))
    shadow(api("org.lwjgl:lwjgl-nfd:3.3.3:natives-macos-arm64"))

    // ImGui
    shadow(implementation(rootProject.files('deps/imgui-binding-1.90.0.jar')))
    shadow(api(rootProject.files('deps/imgui-natives.jar')))
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}


shadowJar {
    configurations = [project.configurations.shadow]
    archiveBaseName = "flashback"
    destinationDirectory = file("${buildDir}/tmp/allJar")

    exclude("LICENSE")
    exclude("LICENSE.txt")
}

// Merge the shaded FFmpeg/native libraries with the main jar (which contains Loom's include jars),
// then remap that merged archive for distribution. Do not rename over the jar task output here:
// File.renameTo fails when that destination already exists on Windows, silently dropping all shaded deps.
def mergedDistributionJar = tasks.register("mergeShadowWithIncludes", Jar) {
    archiveBaseName.set("merged")
    from(zipTree(project.tasks.jar.archiveFile))
    from(zipTree(project.tasks.shadowJar.archiveFile))
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

tasks.named("remapJar") {
    dependsOn(mergedDistributionJar)
    inputFile.set(mergedDistributionJar.flatMap { it.archiveFile })
}
project.assemble.dependsOn(mergedDistributionJar)
